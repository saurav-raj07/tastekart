<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TasteKart — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/styles/customer/base.css" />
  <link rel="stylesheet" href="/styles/customer/auth.css" />
  <link rel="stylesheet" href="/styles/customer/login.css" />
</head>

<body>
  <main class="login-page"><a class="login-logo" href="/"><img src="/assets/tastekart_logo.png" alt="TasteKart" /></a>
    <section class="login-card"><span class="kicker">TASTEKART ACCOUNT</span>
      <h1 id="loginTitle">Welcome back</h1>
      <p id="loginMessage">Log in to save your details and track orders.</p>
      <form id="loginForm"><input id="loginName" placeholder="Your name" autocomplete="name" /><input id="loginUsername"
          required placeholder="Username or email" autocomplete="username" /><input id="loginPassword" type="password"
          required minlength="6" placeholder="Password (6+ characters)" autocomplete="current-password" /><button
          class="primary-btn full" type="submit"><span id="loginSubmit">Log in</span> <span>→</span></button></form>
      <button class="auth-switch" id="loginSwitch">New here? Create an account</button><a class="back-link login-back"
        href="/">← Back to restaurants</a>
    </section>
  </main>
  <script src="/scripts/customer/login.js"></script>
</body>

</html>
