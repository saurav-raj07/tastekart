<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your orders | TasteKart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/styles/customer/base.css" />
    <link rel="stylesheet" href="/styles/customer/cart.css" />
</head>

<body>
    <header class="topbar"><a class="brand" href="/"><img src="/assets/tastekart_logo.png" alt="TasteKart" width="72"
                height="64" style="object-fit:contain" /></a>
        <div class="header-actions"><a class="back-link" href="/">← Main page</a><a class="menu-cart-link"
                href="/cart">🛒 Cart</a></div>
    </header>
    <main class="cart-page">
        <div class="cart-page-heading"><span class="kicker">TASTEKART</span>
            <h1>Your orders</h1>
            <p>Track your latest meals and revisit your order history.</p>
        </div>
        <section class="cart-page-card">
            <div id="ordersList" class="customer-orders-list">Loading your orders…</div>
        </section>
    </main>
    <script src="/scripts/customer/orders.js"></script>

</html>
