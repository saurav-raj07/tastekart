<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Restaurant menu | TasteKart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/styles/customer/base.css" />
    <link rel="stylesheet" href="/styles/customer/menu.css" />
    <link rel="stylesheet" href="/styles/customer/restaurant-menu.css" />
</head>

<body>
    <header class="topbar"><a class="brand" href="/"><img class="brand-logo" src="/assets/tastekart_logo.png"
                alt="TasteKart" width="72" height="64" style="object-fit:contain" /></a>
        <div class="location"><span class="pin">⌖</span><span><small>DELIVERING TO</small><strong>Choose an
                    address</strong></span></div>
        <div class="header-actions"><a class="header-link" href="/orders">Your orders</a><a class="menu-cart-link"
                href="/cart" aria-label="Open cart">🛒 <span id="menuCartCount">0</span></a></div>
    </header>
    <main class="restaurant-menu-page"><a class="back-link" href="/">← Back to restaurants</a>
        <section class="restaurant-menu-heading"><span class="kicker">RESTAURANT MENU</span>
            <h1 id="restaurantName">Loading menu…</h1>
            <p id="restaurantDetails"></p>
        </section>
        <section class="restaurant-menu-card">
            <div id="restaurantMenuItems" class="restaurant-menu-items"></div>
        </section>
    </main><a class="menu-floating-cart" href="/cart"><span>🛒</span><strong id="menuFloatingCount">0</strong><b
            id="menuFloatingTotal">₹0</b></a>
    <div class="toast" id="toast"></div>
    <script src="/scripts/customer/restaurant-menu.js"></script>
</body>

</html>
