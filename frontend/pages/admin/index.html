<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>TasteKart admin</title><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/><link rel="stylesheet" href="/styles/admin/admin.css"/></head>
<body><header class="admin-topbar"><a href="/" class="admin-brand"><img src="/assets/tastekart_logo.png" alt="TasteKart"/><span>Admin console</span></a><div class="admin-user"><span id="adminName"></span><button id="adminLogout" hidden>Log out</button></div></header><main class="admin-shell"><section class="admin-heading"><span class="eyebrow">TASTEKART OPERATIONS</span><h1>Restaurant network</h1><p>Review every restaurant onboarded by TasteKart partners.</p></section><section class="admin-stats" id="adminStats"></section><section class="admin-panel"><div class="admin-panel-head"><div><span class="eyebrow">ONBOARDED RESTAURANTS</span><h2>All partner restaurants</h2></div><button id="refreshAdmin" class="refresh-button">Refresh</button></div><div id="restaurantList" class="restaurant-list"></div></section></main><div id="adminAuth" class="admin-auth"><div class="admin-auth-card"><span class="eyebrow">EMPLOYEE ACCESS</span><h2>Welcome to TasteKart admin</h2><p>This workspace is restricted to TasteKart employees.</p><form id="adminLoginForm"><input id="adminEmail" type="email" required placeholder="Employee email"/><input id="adminPassword" type="password" required placeholder="Password"/><button class="primary" type="submit">Log in <span>→</span></button></form><p id="adminMessage" class="admin-message"></p></div></div><script src="/scripts/admin/admin.js"></script></body></html>
