apiVersion: v1
kind: Secret
metadata:
  name: tastekart-secret
  namespace: tastekart
  labels:
    app.kubernetes.io/name: tastekart-secret
    app.kubernetes.io/part-of: tastekart-platform
type: Opaque
stringData:
  # In-cluster MongoDB service (deployed via k8s/mongodb.yaml)
  MONGO_URL: "mongodb://mongodb:27017"
  JWT_SECRET: "prod-jwt-secret-replace-in-pipeline"
  SERVICE_TOKEN: "tastekart-internal-service-token-secret"
  TASTEKART_ADMIN_EMAIL: "admin@tastekart.com"
  TASTEKART_ADMIN_PASSWORD: "ChangeMeAdmin123!"
  MAPPLS_ACCESS_TOKEN: ""
