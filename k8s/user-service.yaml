apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: tastekart
  labels:
    app: user-service
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: tastekart-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: tastekart/backend:latest
          imagePullPolicy: Always
          command: ["uvicorn", "backend.services.user_service.main:app", "--host", "0.0.0.0", "--port", "3002"]
          ports:
            - containerPort: 3002
              name: http
          envFrom:
            - configMapRef:
                name: tastekart-config
            - secretRef:
                name: tastekart-secret
          env:
            - name: PORT
              value: "3002"
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: tastekart
  labels:
    app: user-service
spec:
  type: ClusterIP
  ports:
    - port: 3002
      targetPort: 3002
      name: http
  selector:
    app: user-service
